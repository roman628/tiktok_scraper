# Main Configuration for TikTok Data Collector
# This file contains all configuration options for the collector.py script
# Copy this file to config.toml and fill in your settings
[input]
# Default input source (can be overridden by command line)
default_urls_file = "data/urls.txt"
# Limit number of URLs to process (0 = no limit)
limit = 0

[download]
# Output directory for downloaded content
output_dir = "downloads"
# Video quality: "best", "worst", "720p", "480p", "360p"
quality = "best"
# Download audio only as MP3
audio_only = false
# Enable Whisper transcription
whisper = true
# Whisper model size: "tiny", "base", "small", "medium", "large"
whisper_model = "base"
# Force CPU usage for Whisper even if GPU available
force_cpu = false
# Use OpenAI Whisper (high GPU util 70-90%) instead of faster-whisper (low 5-20% but memory efficient)
use_openai_whisper = true

[comments]
# Maximum comments to extract per video (0 = all comments)
max_comments = 10

[processing]
# Save progress every N videos
batch_size = 10
# Delay between requests in seconds
delay = 2
# Number of worker processes for parallel processing (1 = single process)
workers = 1
# Auto-stop after N consecutive checks with no URLs (0 = never stop)
max_idle_checks = 3
# Seconds between queue checks
queue_check_interval = 5

[output]
# Main JSON output file (used only when database.enabled=false)
# When using PostgreSQL, this setting is ignored
json_output = "data/master2.json"

[display]
# Display mode for progress tracking
# Options: "rich" (enhanced terminal UI), "simple" (basic output), "auto" (detect TTY)
mode = "auto"
# Save raw output to timestamped log file
raw_log = false
# Directory for raw log files
raw_log_dir = "logs"
# Display refresh rate in Hz (for rich mode)
refresh_rate = 10
# Maximum console output lines per worker (for rich mode)
max_console_lines = 5
# Enable colored output
color_output = true

[resume]
# Skip already processed URLs (duplicate detection)
skip_duplicates = true
# Force redownload even if URL was already processed
force_redownload = false
# Start fresh, ignoring existing progress
clean_start = false

[network]
# Proxy URL (optional, leave empty for no proxy)
# Format: http://proxy:port or socks5://proxy:port
proxy = ""

[paths]
# Directory structure
data_dir = "data"
downloads_dir = "downloads"
src_dir = "src"
tests_dir = "tests"
logs_dir = "logs"

[system]
# System-level settings
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = "INFO"
# Auto-clean master JSON to remove duplicates after processing
auto_clean_json = true
# Enable progress bars
show_progress = true

[data_collection]
# Enable/disable specific data collectors
metadata = true        # Video download and metadata extraction
transcription = true   # Whisper AI transcription
comments = false       # TikTok API comments (currently non-functional)
hashtags = true        # Extract hashtags from titles/descriptions
ocr_text = true        # Extract on-screen text from first frame using OCR
context_identification = true  # Identify content categories using AI analysis of transcripts

[database]
# PostgreSQL configuration (recommended over JSON for better performance)
# Database credentials are set via environment variables:
# POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_PORT
enabled = true         # PostgreSQL is now the default storage
host = "localhost"     # Use "postgres" when running in Docker
port = 5432           # Default PostgreSQL port
database = "tiktok_scraper"
min_connections = 2    # Minimum database connections in pool
max_connections = 10   # Maximum database connections in pool

# Migration settings
auto_migrate = false   # Automatically migrate existing JSON data to database on startup
migration_batch_size = 100  # Number of records to migrate at once

[ml]
# Machine Learning model configuration
# These settings control how the ML model filters training data
# to focus on Reddit-like content (text-heavy, narrative videos)
min_duration = 45            # Minimum video duration in seconds for training data
min_words = 150              # Minimum words in transcription to include in training
min_words_per_second = 2.0   # Minimum speaking rate (filters out music/dance videos)
filter_reddit_like = true    # Enable filtering to focus on Reddit-style content
auto_train_after_collection = false  # Automatically start ML training after collector finishes