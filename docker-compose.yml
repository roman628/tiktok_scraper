services:
  master-downloader:
    build: .
    container_name: master-downloader
    volumes:
      - ./assets:/app/assets
      - ./downloads:/app/downloads
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true