services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: tiktok_postgres
    environment:
      - POSTGRES_DB=tiktok_scraper
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "100.127.122.120:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/medallion_architecture.sql:/docker-entrypoint-initdb.d/02-medallion.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Single Web Container - Django + Collector + ML Training
  web:
    build: .
    container_name: tiktok_app
    ports:
      - "100.127.122.120:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
      - /dev/nvidia-modeset
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=tiktok_scraper
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-}
      - DATABASE_MIN_CONNECTIONS=${DATABASE_MIN_CONNECTIONS:-2}
      - DATABASE_MAX_CONNECTIONS=${DATABASE_MAX_CONNECTIONS:-10}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-your-secret-key-here-change-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - MS_TOKEN=${MS_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./ml:/app/ml
      - ./media:/app/media
      - ./src:/app/src
      - ./utils:/app/utils
      - ./config.toml:/app/config.toml
      # Hot-swap templates for development
      - ./server/templates:/app/server/templates
      - ./server/background_tasks.py:/app/server/background_tasks.py
      - ./server/management:/app/server/management
    command: >
      sh -c "
        python manage.py migrate &&
        echo 'Starting Django server with integrated collector and ML support...' &&
        python manage.py runserver 0.0.0.0:8000
      "
    restart: unless-stopped

volumes:
  postgres_data: