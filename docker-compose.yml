services:
  # Main TikTok Scraper Service  
  main-scraper:
    build: .
    container_name: tiktok-main-scraper
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./backups:/app/backups
      - ./logs:/app/logs
      - ./master2.json:/app/master2.json
      - ./urls.txt:/app/urls.txt
      - ./keyword_score_map.json:/app/keyword_score_map.json
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
    networks:
      - tiktok-net
    depends_on:
      - selenium-hub
    command: ["python", "main.py", "--workers", "3"]

  # Keyword Scoring System
  keyword-scoring:
    build: .
    container_name: tiktok-keyword-scoring
    working_dir: /app/keyword_scoring_system
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./master2.json:/app/master2.json
      - ./keyword_scoring_system:/app/keyword_scoring_system
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - tiktok-net
    command: ["python", "keyword_scorer.py", "/app/master2.json", "--output", "/app/outputs/"]

  # Reddit Scraper Service
  reddit-scraper:
    build: .
    container_name: tiktok-reddit-scraper
    working_dir: /app/reddit_scraper
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./reddit_scraper:/app/reddit_scraper
      - ./reddit_scraper/config.env:/app/reddit_scraper/config.env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - tiktok-net
    depends_on:
      - selenium-hub
    command: ["python", "main.py", "--batch", "users.txt", "--format", "json"]

  # Performance Predictor Service
  performance-predictor:
    build: .
    container_name: tiktok-performance-predictor
    working_dir: /app/performance_predictor
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./performance_predictor:/app/performance_predictor
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - tiktok-net
    ports:
      - "8000:8000"
    command: ["python", "predictor_api.py"]

  # TikTok Insights Dashboard
  tiktok-insights:
    build: .
    container_name: tiktok-insights-dashboard
    working_dir: /app/tiktok_insights
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./tiktok_insights:/app/tiktok_insights
      - ./master2.json:/app/master2.json
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - tiktok-net
    ports:
      - "8080:8080"
    command: ["python", "scripts/improved_dashboard.py"]

  # Video Analysis Service
  video-analysis:
    build: .
    container_name: tiktok-video-analysis
    working_dir: /app/video_analysis
    volumes:
      - ./downloads:/app/downloads
      - ./outputs:/app/outputs
      - ./video_analysis:/app/video_analysis
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - tiktok-net
    command: ["python", "analyze_ubuntu_videos.py"]

  # Selenium Hub for Browser Automation
  selenium-hub:
    image: selenium/hub:4.15.0
    container_name: selenium-hub
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    networks:
      - tiktok-net

  # Chrome Node for Selenium
  chrome-node:
    image: selenium/node-chrome:4.15.0
    container_name: chrome-node
    shm_size: 2gb
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_INSTANCES=2
      - SE_NODE_MAX_SESSIONS=2
    depends_on:
      - selenium-hub
    networks:
      - tiktok-net

  # Firefox Node for Selenium
  firefox-node:
    image: selenium/node-firefox:4.15.0
    container_name: firefox-node
    shm_size: 2gb
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_INSTANCES=2
      - SE_NODE_MAX_SESSIONS=2
    depends_on:
      - selenium-hub
    networks:
      - tiktok-net

networks:
  tiktok-net:
    driver: bridge

volumes:
  data:
  downloads:
  models:
  outputs:
  backups:
  logs: