# Docker Compose Override for Development
# This file extends docker-compose.yml with development-specific settings

services:
  main-scraper:
    environment:
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount source code for live development
      - ./main.py:/app/main.py
      - ./core:/app/core
      - ./scripts:/app/scripts
    # Enable interactive mode for debugging
    stdin_open: true
    tty: true

  keyword-scoring:
    environment:
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount source code for live development
      - ./keyword_scoring_system/src:/app/keyword_scoring_system/src
      - ./keyword_scoring_system/keyword_scorer.py:/app/keyword_scoring_system/keyword_scorer.py

  reddit-scraper:
    environment:
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount source code for live development
      - ./reddit_scraper/core:/app/reddit_scraper/core
      - ./reddit_scraper/services:/app/reddit_scraper/services
      - ./reddit_scraper/main.py:/app/reddit_scraper/main.py

  performance-predictor:
    environment:
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount source code for live development
      - ./performance_predictor/predict_performance.py:/app/performance_predictor/predict_performance.py
      - ./performance_predictor/predictor_api.py:/app/performance_predictor/predictor_api.py

  tiktok-insights:
    environment:
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount source code for live development
      - ./tiktok_insights/scripts:/app/tiktok_insights/scripts

  video-analysis:
    environment:
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount source code for live development
      - ./video_analysis/analyze_ubuntu_videos.py:/app/video_analysis/analyze_ubuntu_videos.py
      - ./video_analysis/video_transcriber.py:/app/video_analysis/video_transcriber.py